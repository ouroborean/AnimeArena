<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11131a" />
  <title>Anime Arena</title>
  <script>
    // Dev cache-bust: the static file server (python http.server) sends no Cache-Control, so the
    // browser serves stale style.css/app.js after edits. Append a per-load version to force a fresh
    // fetch. document.write keeps these in the parse flow so app.js's DOMContentLoaded boot still
    // fires (async <script> injection would run after DOMContentLoaded and never boot).
    document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
    // Apply the saved UI theme before first paint (avoids a flash of the default). "dark" = no attr.
    try { var _th = localStorage.getItem("aa_theme") || "noir"; if (_th !== "dark") document.documentElement.setAttribute("data-theme", _th); } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    var _v = Date.now();
    document.write('<script src="net.js?v=' + _v + '"><\/script>');
    document.write('<script src="app.js?v=' + _v + '"><\/script>');
  </script>
</body>
</html>
